name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: 🚀 Build React frontend
        run: |
          cd frontend
          npm run build

      - name: 📁 Prepare Hostinger deployment package
        run: |
          mkdir -p deploy_out
          # 1. Copy compiled frontend (HTML, JS, CSS, assets, favicons)
          cp -r frontend/dist/* deploy_out/
          # 2. Copy PHP backend APIs and configuration
          cp -r backend/api deploy_out/
          cp -r backend/config deploy_out/
          cp -r backend/includes deploy_out/
          cp backend/index.php deploy_out/api/index.php 2>/dev/null || true
          # 3. Apply Hostinger Apache rewrite rules
          if [ -f backend/hostinger.htaccess ]; then
            cp backend/hostinger.htaccess deploy_out/.htaccess
          elif [ -f backend/.htaccess ]; then
            cp backend/.htaccess deploy_out/.htaccess
          fi

      - name: 📤 Deploy to Hostinger via Python FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: '.'
          CLEAN_NESTED_PUBLIC_HTML: 'true'
        run: |
          python3 scripts/deploy_hostinger.py
